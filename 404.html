<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Lucent</title>
    <style>
      :root {
        --bg: #0a0e12;
        --lime: #b8ff5c;
        --text: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
        line-height: 1.5;
      }
      .wrap { max-width: 30rem; }
      .brand {
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--lime);
        margin: 0 0 1.5rem;
      }
      .code {
        font-size: clamp(4.5rem, 18vw, 8rem);
        font-weight: 800;
        line-height: 0.9;
        margin: 0;
        color: var(--lime);
      }
      h1 {
        font-size: clamp(1.25rem, 5vw, 1.75rem);
        font-weight: 700;
        margin: 1rem 0 0.5rem;
      }
      p {
        margin: 0 auto 2rem;
        max-width: 24rem;
        color: rgba(255, 255, 255, 0.72);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      a.btn {
        display: inline-block;
        padding: 0.8rem 1.5rem;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.95rem;
        text-decoration: none;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      a.btn:hover { transform: translateY(-2px); }
      a.btn--primary {
        background: var(--lime);
        color: var(--bg);
      }
      a.btn--ghost {
        border: 1px solid rgba(255, 255, 255, 0.28);
        color: var(--text);
      }
      a.btn--ghost:hover { border-color: var(--lime); color: var(--lime); }
    </style>
  </head>
  <body>
    <main class="wrap">
      <p class="brand">Lucent</p>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>This play didn&rsquo;t make the highlight reel. The page you&rsquo;re looking for has moved or never existed.</p>
      <div class="actions">
        <a class="btn btn--primary" href="/index.html">Back to home</a>
        <a class="btn btn--ghost" href="/index.html#elevate">Join the waitlist</a>
      </div>
    </main>
  </body>
</html>
