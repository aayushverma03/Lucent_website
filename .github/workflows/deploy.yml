name: Deploy to EC2

# Deploys the static site to the EC2 instance on every push to main.
# Requires these repository secrets (Settings -> Secrets and variables -> Actions):
#   EC2_HOST     Elastic IP or domain of the instance (e.g. 203.0.113.10)
#   EC2_USER     SSH user (ubuntu for Ubuntu AMIs)
#   EC2_SSH_KEY  Full private key that can SSH in (contents of your .pem)
#   EC2_PORT     Optional SSH port (defaults to 22)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Install/update the waitlist backend instead of the site"
        type: boolean
        default: false

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.deploy_backend != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${{ secrets.EC2_PORT }}"; PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy with rsync
        run: |
          PORT="${{ secrets.EC2_PORT }}"; PORT="${PORT:-22}"
          rsync -avz --delete --delete-excluded \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'deploy' \
            --exclude 'backend' \
            --exclude '*.md' \
            --exclude '*.pdf' \
            --exclude '.gitignore' \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/lucent/"

  # One-time / rare: installs the waitlist API service + nginx /api proxy.
  # Run from the Actions tab with "deploy_backend" checked. Extra secrets:
  #   WAITLIST_FROM_EMAIL  SES-verified sender for signup alerts
  #   WAITLIST_ALERT_TO    inbox that receives signup alerts
  #   AWS_REGION           SES region (optional, defaults to eu-west-1)
  backend:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_backend == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${{ secrets.EC2_PORT }}"; PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" >> "$GITHUB_ENV"

      - name: Ship backend and deploy tooling
        run: |
          PORT="${{ secrets.EC2_PORT }}"; PORT="${PORT:-22}"
          $SSH "mkdir -p ~/lucent-setup"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes" \
            backend deploy "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/lucent-setup/"

      - name: Install backend service
        run: |
          $SSH "cd ~/lucent-setup && sudo AWS_REGION='${{ secrets.AWS_REGION }}' WAITLIST_FROM_EMAIL='${{ secrets.WAITLIST_FROM_EMAIL }}' WAITLIST_ALERT_TO='${{ secrets.WAITLIST_ALERT_TO }}' ./deploy/setup-backend.sh"

      - name: Install nginx /api proxy
        run: |
          $SSH "cd ~/lucent-setup && sudo ./deploy/install-api-proxy.sh"

      - name: Smoke test
        run: |
          $SSH "curl -sf http://127.0.0.1:8787/api/health && echo ' service OK' || { echo '--- service diagnostics ---'; sudo systemctl status lucent-waitlist --no-pager | head -15; sudo journalctl -u lucent-waitlist -n 30 --no-pager; exit 7; }"
          curl -sf https://www.lucent-ai.app/api/health && echo " public OK"
